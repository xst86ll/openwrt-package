name: Build K2P A2 Passwall Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🧱 安装依赖
      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget \
          autopoint libtool-bin pkg-config curl

      # 📦 拉源码（稳定源）
      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default

      # 🔄 更新 feeds
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ⚙️ 固件配置（关键优化版）
      - name: Generate Config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y

          # LuCI
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y

          # Passwall
          CONFIG_PACKAGE_luci-app-passwall=y

          # ⚠️ 不内置 Xray（避免爆空间）
          # 改为运行时安装（重点！）

          # 基础组件
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y

          # 精简（给空间）
          CONFIG_PACKAGE_ipv6helper=n
          CONFIG_PACKAGE_ip6tables=n
          CONFIG_PACKAGE_ppp=n
          CONFIG_PACKAGE_ppp-mod-pppoe=n
          CONFIG_PACKAGE_firewall4=n
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_iptables=y

          EOF

          make defconfig

      # 📥 下载源码包
      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc)

      # 🔨 编译
      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # 📦 上传固件
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: K2P-A2-Stable
          path: openwrt/bin/targets/**/*
