name: Build OpenWrt for K2P A2 (Passwall Slim)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-distutils rsync unzip zlib1g-dev file wget

    - name: Clone OpenWrt
      run: |
        git clone https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        git checkout openwrt-23.05

    - name: Update & Install Feeds
      run: |
        cd openwrt
        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom config (K2P A2 Slim)
      run: |
        cd openwrt

        cat > .config << 'EOF'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y

        CONFIG_PACKAGE_luci=y
        CONFIG_LUCI_LANG_zh_Hans=y

        # Passwall（精简版）
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_xray-core=y
        CONFIG_PACKAGE_v2ray-geodata=y

        # 必要依赖
        CONFIG_PACKAGE_dnsmasq=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_curl=y

        # 精简（关键！防止超16MB）
        CONFIG_PACKAGE_ipv6helper=n
        CONFIG_PACKAGE_ip6tables=n
        CONFIG_PACKAGE_ppp=n
        CONFIG_PACKAGE_ppp-mod-pppoe=n
        CONFIG_PACKAGE_firewall4=n

        # 使用iptables（兼容passwall）
        CONFIG_PACKAGE_firewall=y
        CONFIG_PACKAGE_iptables=y
        CONFIG_PACKAGE_iptables-mod-tproxy=y

        EOF

        make defconfig

    - name: Download package
      run: |
        cd openwrt
        make download -j8

    - name: Compile firmware
      run: |
        cd openwrt
        make -j$(nproc) V=s

    - name
