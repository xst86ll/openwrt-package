name: K2P A2 100% Stable Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🧠 清理磁盘（关键）
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h

      # 🧠 防炸内存
      - name: Setup Swap
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # 📦 依赖
      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget curl \
          autopoint libtool-bin pkg-config

      # 📥 固定版本源码（关键稳定点）
      - name: Clone Source
        run: |
          git clone --depth=1 --branch v23.05.3 https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default

      # 🔄 feeds
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ⚙️ 极简稳定配置（不会炸）
      - name: Generate Config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y

          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y

          # 只装 Passwall UI（核心不编译）
          CONFIG_PACKAGE_luci-app-passwall=y

          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y

          # 精简
          CONFIG_PACKAGE_ipv6helper=n
          CONFIG_PACKAGE_ip6tables=n
          CONFIG_PACKAGE_ppp=n
          CONFIG_PACKAGE_ppp-mod-pppoe=n
          CONFIG_PACKAGE_firewall4=n
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_iptables=y
          EOF

          make defconfig

      # 📥 下载（3次重试）
      - name: Download
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s || make download -j1 V=s

      # 🔨 编译（双保险）
      - name: Compile
        run: |
          cd openwrt
          make -j1 V=s || make -j1 V=s

      # 📦 输出
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: K2P-A2-100-Stable
          path: openwrt/bin/targets/**/*
