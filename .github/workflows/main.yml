name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  # 改用 GitHub 原始地址，避免 Gitee 认证问题
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  FEED_CONF: feeds.conf.default
  CONFIG_FILE: .config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir
        ln -sf /workdir $HOME/openwrt

    - name: Clone source code
      run: |
        # 克隆 GitHub 源码，仅拉取最新提交（加速+避免认证）
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH $HOME/openwrt
        cd $HOME/openwrt
        # 暂时不更新子模块，先跑通克隆
        # git submodule update --init --recursive --depth 1

    - name: Update feeds
      run: |
        cd $HOME/openwrt
        # 用 GitHub 官方源，避免 Gitee 替换错误
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate config file
      run: |
        cd $HOME/openwrt
        [ -e $CONFIG_FILE ] && cat $CONFIG_FILE >> .config
        # K2P + Passwall 基础配置
        cat >> .config <<EOF
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
        CONFIG_PACKAGE_luci-app-passwall=y
        EOF
        make defconfig

    - name: Download packages
      run: |
        cd $HOME/openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      run: |
        cd $HOME/openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        # 先判断目录是否存在，避免直接报错
        if [ -d "$HOME/openwrt/bin/targets" ]; then
          cd $HOME/openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "::error::编译产物目录不存在，编译可能失败"
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.REPO_BRANCH }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "🔔 编译完成，固件已上传" >> release.txt

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
