name: Build OpenWrt for K2P A2 (Passwall Slim)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # 解决Node.js版本警告（可选但建议保留）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: |
        sudo apt update -o Acquire::Retries=5 -y
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-distutils rsync unzip zlib1g-dev file wget autopoint libtool-bin pkg-config
        sudo apt clean

    - name: Clone OpenWrt
      run: |
        git clone --depth=1 --branch openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        git status

    - name: Update & Install Feeds
      run: |
        cd openwrt
        # 清理旧缓存避免冲突
        rm -rf feeds/passwall
        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default
        ./scripts/feeds clean
        ./scripts/feeds update -a -f
        ./scripts/feeds install -a -f

    - name: Load custom config (K2P A2 Slim)
      run: |
        cd openwrt

        cat > .config << 'EOF'
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y

        CONFIG_PACKAGE_luci=y
        CONFIG_LUCI_LANG_zh_Hans=y

        # Passwall（精简版）
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_xray-core=y
        CONFIG_PACKAGE_xray-geodata=y  # 补充xray地理数据，解决VLESS适配问题
        CONFIG_PACKAGE_v2ray-geodata=y

        # 必要依赖（补充关键库，避免运行报错）
        CONFIG_PACKAGE_dnsmasq=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_libstdcpp=y
        CONFIG_PACKAGE_zlib=y

        # 精简（关键！防止超16MB）
        CONFIG_PACKAGE_ipv6helper=n
        CONFIG_PACKAGE_ip6tables=n
        CONFIG_PACKAGE_ppp=n
        CONFIG_PACKAGE_ppp-mod-pppoe=n
        CONFIG_PACKAGE_firewall4=n

        # 使用iptables（兼容passwall）
        CONFIG_PACKAGE_firewall=y
        CONFIG_PACKAGE_iptables=y
        CONFIG_PACKAGE_iptables-mod-tproxy=y
        EOF

        make defconfig

    - name: Download package
      run: |
        cd openwrt
        # 失败后重试，提高下载成功率
        make download -j$(nproc) || make download -j1 V=s

    - name: Compile firmware
      run: |
        cd openwrt
        # 单线程编译，避免内存溢出（K2P编译推荐）
        make -j1 V=s 2>&1 | tee compile.log

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        name: K2P-A2-Passwall-Slim
        path: openwrt/bin/targets/**/*
        if-no-files-found: ignore
