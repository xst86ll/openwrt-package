name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      target_profile:
        description: 'Target Profile'
        required: true
        default: 'Phicomm K2P'
        type: choice
        options:
          - Phicomm K2P

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Clone source code
        run: |
          git clone https://github.com/coolsnowwolf/lede openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> feeds.conf.default
          ./scripts/feeds update passwall
          ./scripts/feeds install -a -p passwall

      - name: Generate config file
        run: |
          cd openwrt
          cat > .config << EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_passwall=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_shadowsocks-libev=y
          CONFIG_PACKAGE_chinadns-ng=y
          EOF
          make defconfig

      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Firmware
          path: openwrt/bin/targets/ramips/mt7621/*.bin
