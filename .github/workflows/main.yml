name: Build OpenWrt (Anti-Failure)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH for debug (true/false)'
        required: false
        default: 'false'

env:
  # 核心配置：稳定的 GitHub 源 + 深度克隆
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  FEED_CONF: feeds.conf.default
  CONFIG_FILE: .config
  # 必选：开启固件上传，关闭大文件上传节省时间
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # 预设 K2P 架构，避免编译错误
  TARGET_ARCH: ramips/mt7621
  DEVICE_NAME: phicomm_k2p

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # 失败重试机制：最多重试2次
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-22.04
    retry:
      max_attempts: 2
      delay_seconds: 300

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Initialization (防依赖缺失)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 换国内源加速依赖安装
        sudo sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo apt update -y && sudo apt upgrade -y
        # 安装完整编译依赖（补全易缺失组件）
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
                            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
                            file wget curl subversion libelf-dev libncursesw5-dev automake autoconf libtool m4 \
                            texinfo patch pkg-config cmake ninja-build
        sudo apt autoremove -y && sudo apt clean -y
        # 设置时区 + 创建编译目录
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir && sudo chown $USER:$USER /workdir
        ln -sf /workdir $HOME/openwrt

    - name: Clone Source (防克隆失败)
      run: |
        # 容错：多次尝试克隆 + 超时控制
        for i in {1..3}; do
          echo "第 $i 次尝试克隆源码..."
          git clone --depth=1 --single-branch --branch $REPO_BRANCH $REPO_URL $HOME/openwrt && break
          sleep 10
          if [ $i -eq 3 ]; then
            echo "克隆失败，尝试使用备用源..."
            git clone --depth=1 https://gitee.com/lede-project/lede.git -b master $HOME/openwrt
          fi
        done
        cd $HOME/openwrt
        # 子模块更新容错：跳过失败的子模块
        git submodule update --init --recursive --depth=1 2>/dev/null || true

    - name: Update Feeds (防源失效)
      run: |
        cd $HOME/openwrt
        # 替换 feeds 源为国内镜像
        sed -i 's#https://github.com/#https://mirror.ghproxy.com/https://github.com/#g' $FEED_CONF
        sed -i 's#https://git.openwrt.org/#https://mirror.ghproxy.com/https://git.openwrt.org/#g' $FEED_CONF
        # 强制更新 feeds + 容错
        ./scripts/feeds update -a || ./scripts/feeds update -a -f
        ./scripts/feeds install -a

    - name: Add Passwall & VLESS Dependencies (核心修复)
      run: |
        cd $HOME/openwrt
        # 添加 Passwall 源（确保VLESS核心能编译）
        echo "src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main" >> $FEED_CONF
        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main" >> $FEED_CONF
        ./scripts/feeds update passwall passwall_packages
        ./scripts/feeds install -a -p passwall
        ./scripts/feeds install -a -p passwall_packages

    - name: Generate Config (K2P + VLESS 完整配置)
      run: |
        cd $HOME/openwrt
        # 基础配置：K2P 机型
        cat > .config <<EOF
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
        # 必选：开启 VLESS 核心编译
        CONFIG_PACKAGE_xray-core=y
        CONFIG_PACKAGE_v2ray-core=y
        CONFIG_PACKAGE_v2ray-geodata=y
        # Passwall 完整组件
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
        # 精简固件：关闭不必要组件
        CONFIG_PACKAGE_luci-theme-argon=y
        CONFIG_DISABLE_MLXSW=y
        CONFIG_DISABLE_RTK_SWITCH=y
        EOF
        # 自动补全配置，避免编译错误
        make defconfig

    - name: Download Packages (防下载失败)
      run: |
        cd $HOME/openwrt
        # 多线程下载 + 重试
        make download -j$(nproc) || make download -j1
        # 删除损坏的包
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware (防编译崩溃)
      run: |
        cd $HOME/openwrt
        # 先多线程编译，失败则单线程调试
        make -j$(nproc) || make -j1 V=s
        # 检查编译产物是否存在
        if [ ! -d "bin/targets/$TARGET_ARCH" ]; then
          echo "编译失败，输出详细日志..."
          cat build.log
          exit 1
        fi

    - name: Organize Files (防目录缺失)
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd $HOME/openwrt/bin/targets/$TARGET_ARCH
        # 只保留可刷机的固件，删除冗余文件
        rm -rf packages *.manifest *.buildinfo *.json sha256sums
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: K2P_OpenWrt_Passwall_VLESS_${{ env.REPO_BRANCH }}
        path: ${{ env.FIRMWARE }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: K2P_Firmware_${{ github.run_id }}
        body: |
          📱 设备：Phicomm K2P
          📦 内置：Passwall + Xray/V2ray (VLESS支持)
          🎯 架构：ramips/mt7621
        files: ${{ env.FIRMWARE }}/*
