name: Build K2P A2 Passwall (Stable Final)

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:
- name: 1. Checkout
  uses: actions/checkout@v4

- name: 2. 初始化环境（稳定版）
  run: |
    sudo apt update
    sudo apt install -y build-essential clang flex bison g++ gawk \
    gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
    python3 python3-distutils rsync unzip zlib1g-dev file wget \
    libtool-bin curl ca-certificates

- name: 3. 拉取源码（ImmortalWrt 23.05）
  run: |
    git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git -b openwrt-23.05 openwrt

- name: 4. 配置 feeds（关键修复）
  run: |
    cd openwrt

    # 重建 feeds.conf
    rm -f feeds.conf.default
    cp feeds.conf.default.example feeds.conf.default

    # 加入 Passwall
    echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default

    # 更新 feeds
    ./scripts/feeds clean
    ./scripts/feeds update -a

    # 如果失败就手动拉
    if [ ! -d "feeds/passwall" ]; then
      git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall.git feeds/passwall
    fi

    # 安装全部 feeds（最稳）
    ./scripts/feeds install -a

- name: 5. 写入 K2P A2 精简配置
  run: |
    cd openwrt
    cat > .config << 'EOF'
    CONFIG_TARGET_ramips=y
    CONFIG_TARGET_ramips_mt7621=y
    CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y

    CONFIG_PACKAGE_luci=y
    CONFIG_LUCI_LANG_zh_Hans=y

    CONFIG_PACKAGE_luci-app-passwall=y
    CONFIG_PACKAGE_xray-core=y
    CONFIG_PACKAGE_xray-geodata=y
    CONFIG_PACKAGE_v2ray-geoip=y

    CONFIG_PACKAGE_dnsmasq=y
    CONFIG_PACKAGE_ca-bundle=y
    CONFIG_PACKAGE_libstdcpp=y
    CONFIG_PACKAGE_zlib=y

    CONFIG_PACKAGE_ipv6helper=n
    CONFIG_PACKAGE_ip6tables=n
    CONFIG_PACKAGE_ppp=n
    CONFIG_PACKAGE_firewall4=n

    CONFIG_PACKAGE_firewall=y
    CONFIG_PACKAGE_iptables=y
    CONFIG_PACKAGE_iptables-mod-tproxy=y
    EOF

    make defconfig

- name: 6. 下载依赖
  run: |
    cd openwrt
    make download -j8 || make download -j1 V=s

- name: 7. 编译固件（稳定单线程）
  run: |
    cd openwrt
    make -j1 V=s

- name: 8. 上传固件
  uses: actions/upload-artifact@v4
  with:
    name: K2P-A2-Passwall
    path: openwrt/bin/targets/**/*.bin

- name: 9. 上传日志（方便排错）
  uses: actions/upload-artifact@v4
  with:
    name: build-log
    path: openwrt/bin/targets/**/*
