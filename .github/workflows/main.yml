name: Build OpenWrt (Passwall Gitee Fix)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH for debug (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  FEED_CONF: feeds.conf.default
  CONFIG_FILE: .config
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai
  TARGET_ARCH: ramips/mt7621
  DEVICE_NAME: phicomm_k2p

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Initialization
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo sed -i 's#archive.ubuntu.com#mirrors.aliyun.com#g' /etc/apt/sources.list
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo apt update -y && sudo apt upgrade -y
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
                            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
                            file wget curl subversion libelf-dev libncursesw5-dev automake autoconf libtool m4 \
                            texinfo patch pkg-config cmake ninja-build
        sudo apt autoremove -y && sudo apt clean -y
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir && sudo chown $USER:$USER /workdir
        ln -sf /workdir $HOME/openwrt

    - name: Clone Source
      run: |
        for i in {1..3}; do
          echo "第 $i 次尝试克隆源码..."
          git clone --depth=1 --single-branch --branch $REPO_BRANCH $REPO_URL $HOME/openwrt && break
          sleep 10
          if [ $i -eq 3 ]; then
            echo "克隆失败，尝试备用源..."
            git clone --depth=1 https://gitee.com/lede-project/lede.git -b master $HOME/openwrt
          fi
        done
        cd $HOME/openwrt
        git submodule update --init --recursive --depth=1 2>/dev/null || true

    - name: Update Feeds
      run: |
        cd $HOME/openwrt
        ./scripts/feeds update -a || ./scripts/feeds update -a -f
        ./scripts/feeds install -a

    - name: Add Passwall & VLESS Dependencies (Gitee 镜像)
      run: |
        cd $HOME/openwrt
        # 改用 Gitee 镜像源，避免 GitHub 访问问题
        echo "src-git passwall_packages https://gitee.com/xiaorouji/openwrt-passwall-packages.git;main" >> $FEED_CONF
        echo "src-git passwall https://gitee.com/xiaorouji/openwrt-passwall.git;main" >> $FEED_CONF
        # 容错：更新失败不阻断流程
        ./scripts/feeds update passwall passwall_packages || true
        ./scripts/feeds install -a -p passwall || true
        ./scripts/feeds install -a -p passwall_packages || true

    - name: Generate Config (K2P + VLESS)
      run: |
        cd $HOME/openwrt
        cat > .config <<EOF
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt7621=y
        CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
        CONFIG_PACKAGE_xray-core=y
        CONFIG_PACKAGE_v2ray-core=y
        CONFIG_PACKAGE_v2ray-geodata=y
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
        CONFIG_PACKAGE_luci-theme-argon=y
        EOF
        make defconfig

    - name: Download Packages
      run: |
        cd $HOME/openwrt
        make download -j$(nproc) || make download -j1
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      run: |
        cd $HOME/openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Organize Files (容错版)
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        if [ -d "$HOME/openwrt/bin/targets/$TARGET_ARCH" ]; then
          cd $HOME/openwrt/bin/targets/$TARGET_ARCH
          rm -rf packages *.manifest *.buildinfo *.json sha256sums
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "::error::编译产物目录不存在，编译失败"
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 0
        fi

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: K2P_OpenWrt_Passwall
        path: ${{ env.FIRMWARE }}
